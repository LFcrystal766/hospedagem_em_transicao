xata:\n- `PATCH` no @ A: IP novo, `proxied=true`\n- @ AAAA: IPv6 novo, se a hospedagem tiver; senão `DELETE` (o Cloudflare segue atendendo IPv6 na borda)\n- `ftp` em uso → IP novo, cinza. `server`, `mail` e MX não mudam\n- `POST /zones/{id}/purge_cache` com `purge_everything`. Nada de purge no LiteSpeed: o cache da nova já está quente\n- Confere via API que nenhum registro laranja aponta pra `45.224.128.177` ou `2804:3744:0:105::2`", "risk": "critico", "who": "claude", "proof": "Com proxy, o IP de origem é interno ao Cloudflare: visitante e resolvedor continuam vendo IPs do Cloudflare, e a troca vale na hora. `dig +short AAAA crystalnowpp.com.br` → `2804:3744:0:105::2`; `curl -6` na origem atual → 200."}, {"id": "validar-degrau-3", "title": "Validar em produção em até 15 min", "why": "A primeira meia hora decide se volta ou fica. Cada hora quebrada é venda e fbclid perdidos.", "how": "O Claude cria pelo token um `origem.txt` só na hospedagem nova e confere que `https://crystalnowpp.com.br/origem.txt` responde por ela (prova de origem). Depois:\n- Matriz curl completa contra produção = teste da cópia (regra da matriz do baseline-hoje)\n- /api/tracking-health (esperar ~2 min por causa do s-maxage=120): 14 verdes\n- `dig server.` → `35.199.71.234`; `/healthz` e loader com a chave → 200\n- Chromium sem override: loader, Visitor API, cookies, CTA com xcod\n- Logs de acesso do servidor novo (token) com IP de visitante, não do Cloudflare (CF-Connecting-IP ativo)\n- Qualquer item fora do padrão = rollback (A/AAAA de volta pra AZAN, laranja)\n\nNo fim, apaga o `origem.txt`. Licença do Elementor Pro e conta do Rank Math: só se o wp-admin mostrar aviso, e aí reconectar é com o Luiz (login de conta de terceiro, sem API).", "risk": "critico", "who": "claude", "proof": "Checks do tracking-health: vsl-gtm, sem-barra-200, loader-gtm, paginas-vendedor, visitor-api, sgtm, prova-real. Namespaces `elementor-pro/v1` e `rank-math-schema-pro` ativos."}]}, {"id": "p-acompanhamento", "short": "Acompanhamento", "when": "T0 + 2h a T+2 dias", "title": "Acompanhar até provar que nada mudou", "intro": "Quebra de rastreamento não aparece na tela. Aparece como connect rate caindo ou CPA subindo dias depois. Aqui o Claude compara número por número com a linha de base, e a vigia automática cobre as horas em que ninguém está olhando.", "zoneAfter": false, "items": [{"id": "connect-rate-hora", "title": "Vigiar o connect rate nas 24h depois do degrau 2 e depois do degrau 3", "why": "É o termômetro mais rápido de LPV perdido: redirect novo, GTM atrasado ou página lenta. Já caiu de ~84% pra ~25% num incidente de redirect. O degrau 2 já muda o caminho de cada clique pago, então a vigília vale pros dois.", "how": "Rodado pela vigia automática, não pela conversa. O Claude lê o Graph (GET insights com breakdown horário, sem campanhas WPP): LPV ÷ link clicks acumulado desde a mudança, mais o TTFB (`curl -w`).\n- Só julga com volume mínimo: ≥150 link clicks desde a mudança (de madrugada o volume é pequeno)\n- Critério: ≥72% e dentro de 5 pontos da mesma faixa horária da linha de base\n- Abaixo de 72% por 2h seguidas = rollback: @/www cinza no degrau 2, IP da AZAN no degrau 3", "risk": "alto", "who": "claude", "proof": "Base: connect com barra 80-84% (01-03/09), sem barra 83,7% depois do snippet. TTFB ~105 ms. Graph horário já usado em `/api/meta-spend/hourly`."}, {"id": "primeira-venda", "title": "Seguir a primeira venda real depois de cada degrau até o Purchase na Meta", "why": "Só uma venda real prova que webhook, Stape Store, CAPI Purchase e o IP do comprador ficaram iguais. O webhook do dashboard vai pra vercel.app e não passa pelo nosso DNS: sozinho, ele não prova nada do Purchase.", "how": "Na primeira venda depois de cada degrau, o Claude confere:\n- `webhook_logs` do dashboard (`/api/webhooks/assiny` processed): só prova que a venda existe\n- **Logs do Stape pela API de conta**: POST `/lead/` com `approved_purchase` chegando no mesmo host de antes e a saída pra Meta (CAPI Purchase) com 200. É a única prova direta do Purchase server-side\n- `url_parameters`: `referrer` = `https://crystalnowpp.com.br/` e `xcod` presente\n- Ficha do xcod no Stape Store com fbc/fbp/geo e **IP público, não do Cloudflare** (classificado sem imprimir). Esse IP vem do begin_checkout que o navegador manda direto pro `server.`, então só muda se o `server.` ficar laranja: aí volta pra cinza na hora\n\nSem a chave do Stape, o fallback é print do Luiz em Stape > Logs filtrado em `/lead/`.", "risk": "alto", "who": "claude", "proof": "Base de 11/09: 12/12 fichas com IP público (8 IPv6, 4 IPv4). Trigger 'Purchase - Assiny' = Data Client + approved_purchase; begin_checkout = cliente GA4 (ip_override via getRemoteAddress) → Store Writer."}, {"id": "sgtm-volume-por-dominio", "title": "Comparar o volume do sGTM no `server.` com a linha de base depois de cada degrau", "why": "O loader do `server.` é a única fonte do GTM. Se algo antes dele quebrar (snippet fora da cópia, challenge, página lenta), cai o volume de page_view/begin_checkout no sGTM horas antes do connect rate e dias antes do CPA.", "how": "O Claude lê pela API de conta do Stape:\n- Base: requests por dia no domínio `server.crystalnowpp.com.br` dos últimos 7 dias e POST `/lead/` por venda aprovada\n- Depois de cada degrau: mesma leitura; pra hora a hora, conta nos logs (page_view, begin_checkout, `/lead/`)\n- Queda de mais de 20% contra o mesmo horário da base, sem queda de cliques na Meta (Graph GET), = investigar na hora; sem causa em 1h, rollback do degrau", "risk": "alto", "who": "claude", "proof": "Doc Stape: 'get statistics of request by day and by domain'. HTML das 43 páginas sem googletagmanager.com: o GTM só chega pelo loader `server.crystalnowpp.com.br/67hcnvgovw.js`."}, {"id": "purchases-dia-seguinte", "title": "Fechar Purchases Meta × vendas Assiny e os plays do vTurb no dia seguinte", "why": "Queda de EMQ, de Purchase no CAPI ou de plays do player só aparece no consolidado do dia.", "how": "Em D+1, o Claude compara com a média de 7 dias da base:\n- Purchases atribuídos ÷ vendas de anúncio maduras (banda da Auditoria, 40%-350%) e o card de Sanidade\n- Divisão navegador × servidor do Pixel (GET, sem /stats)\n- Plays e sessões do vTurb (API)\n- Card de Upsell Lion/Pegada por 48h (one-click)", "risk": "alto", "who": "claude", "proof": "Purchases ~1:1 com vendas de anúncio (mais a duplicação aceita do funil closer). `vturb_daily_stats` desde 01/04/26."}, {"id": "eventos-seguranca-48h", "title": "Consultar os Security Events do Cloudflare de 6 em 6h por 48h", "why": "Uma regra gerenciada ou o Browser Integrity Check pode desafiar um crawler da Meta, a Auditoria da Vercel ou um navegador in-app, e ninguém fica sabendo. No Free, o Cloudflare guarda esses eventos só por 24h, amostrados.", "how": "O Claude consulta `firewallEventsAdaptive` (GraphQL) de 6 em 6h, filtrando Block/Challenge por path e user-agent. Ocorrência em `/crystal-*`, `/rmkt-v1/`, vendedor, one-click, `wp-json` ou `facebookexternalhit`:\n- Barrado pelo BIC → Configuration Rule com BIC off só naquele caminho\n- Barrado por regra gerenciada do WAF → exceção (Skip) no WAF, só naquele caminho", "risk": "medio", "who": "claude", "proof": "Doc Security Events: Free = 'Up to the last 24 hours', 'Sampled logs only'. Doc WAF exceptions (skip por expressão). O tracking-health busca o site a partir de IPs da Vercel."}]}, {"id": "p-sair-azan", "short": "Sair da AZAN", "when": "T+3 a T+30 dias", "title": "Pós-virada: e-mail, leticiafelisberto.com e só então cancelar", "intro": "O site já saiu, mas a AZAN ainda segura o e-mail @crystalnowpp, o site e o DNS do leticiafelisberto.com (duas páginas do funil, o checkout Guru e a antiga recuperação do Registro.br) e o rollback. Ela só é cancelada quando tudo isso tiver outro dono.", "zoneAfter": false, "items": [{"id": "migrar-email", "title": "Executar a migração do e-mail escolhida", "why": "Enquanto o `mail.` e o MX apontam pra AZAN, cancelar a AZAN mata o recebimento e o envio de e-mail @crystalnowpp.", "how": "Conforme o item decidir-email:\n- **Email Routing**: o Claude liga via API e cadastra o endereço de destino. O Luiz abre o e-mail de verificação da Cloudflare no Gmail e clica em **Verify email address** (sem isso a regra fica desligada, e não há API pra esse clique). Só então o Claude apaga o MX `mail.` e o DKIM `default` e cria as regras. O Cloudflare cria sozinho `route1/2/3.mx.cloudflare.net`, SPF `v=spf1 include:_spf.mx.cloudflare.net ~all` e DKIM `cf2024-1._domainkey`, e trava esses registros. Só recebe e encaminha: enviar como @crystalnowpp exige SMTP à parte\n- **Hospedagem nova ou Workspace**: o Luiz contrata/cria as caixas (sem API de contratação). O Claude migra as mensagens por IMAP e troca MX/SPF/DKIM na zona\n- Em todos: DMARC `p=none` fica. Teste = um e-mail real chegando no destino e um envio pelo SMTP novo", "risk": "critico", "who": "ambos", "proof": "MX, SPF e DKIM de hoje são todos da AZAN (Exim + relay MailChannels). Doc Email Routing: 'Until a destination address is verified, any routing rule that points to it stays disabled'."}, {"id": "leticia-destino", "title": "Dar destino ao leticiafelisberto.com e ao crystal.leticiafelisberto.com antes de cancelar", "why": "Sair da AZAN derruba o site da Letícia, `/crystal-downsell/` (3 upsells Pegada) e `/crystal-obrigado/` (upsell Lion), o `treinamentos.leticiafelisberto.com` do checkout Guru (renovações) e o MX do Google Workspace. E o `crystal.leticiafelisberto.com` segue servindo a cópia VELHA do Crystal.", "how": "Projeto próprio, com o mesmo método em degraus:\n- O Luiz decide onde fica o WordPress do leticiafelisberto.com e troca os NS no registrador (PDR, sem API nossa)\n- O Claude monta no Cloudflare a cópia fiel do export `DNS::parse_zone` (o AXFR é recusado), **toda cinza** no primeiro degrau: 5 MX Google, SPF atual, `_dmarc` `v=DMARC1;p=none;`, `google-site-verification`, A de `@`, `crystal` e `www.crystal`, e `treinamentos` CNAME `hosted.clkdmg.site` **sempre cinza** (checkout Guru no Google Cloud)\n- `/crystal-downsell/` e `/crystal-obrigado/` entram no go/no-go do projeto (200, query preservada)\n- `crystal.leticiafelisberto.com`: 301 pra `https://crystalnowpp.com.br` preservando path e query, ou desativar, depois de conferir na lista dos funis que ninguém usa esse host. O 301 não pode tocar nas duas páginas do funil\n- O `ip4:45.224.128.177` do SPF só sai quando o site sair da AZAN", "risk": "critico", "who": "ambos", "proof": "`dig NS leticiafelisberto.com` → ns1/ns2.jupiter; MX aspmx + alt1-4; `treinamentos` CNAME `hosted.clkdmg.site` (34.149.23.191). GET 11/09: upsell-dourado-pegada, upsell-pegada-v3-397(-cartao) → `/crystal-downsell`; upsell-lion-crystal → `/crystal-obrigado`."}, {"id": "corrigir-301-sem-query", "title": "Corrigir o bug que já existe: 301 sem barra perdendo fbclid e utm", "why": "Não é causado pela migração, mas qualquer link sem barra de /rmkt-v1, /crystal-v6-teste ou das páginas de vendedor perde o fbclid, e com ele fbc, atribuição e as UTMs pra Assiny. E o próprio teste pode gravar fbclid falso no cache (item limpar-301-envenenado).", "how": "O Claude testa na origem nova com o cache semeado: primeiro a URL pelada (`/rmkt-v1`), depois `/rmkt-v1?cbx<ts>=1`. Só conclui 'sumiu' se o hit também preservar a query, ou se o servidor novo não for LiteSpeed. Se continua, propõe um plano curto pra OK do Luiz: Single Redirects no Cloudflare de cada slug sem barra pra versão com barra, 301 com 'Preserve query string'. **Nunca** incluir `/crystal-teste`. O redirect acontece na borda, antes do cache da origem.", "risk": "medio", "who": "claude", "proof": "`/rmkt-v1?fbclid=TESTE3&utm_content=AD1` → 301 pra `/rmkt-v1/` sem query (`x-litespeed-cache: hit`). Com o cache furado, a origem preserva a query."}, {"id": "subir-php-82", "title": "Subir o PHP da nova pra 8.2, com o snippet do /crystal-teste conferido", "why": "PHP 7.4 está fora de suporte desde 2022. Subir no meio da virada misturaria duas mudanças; agora, com tudo estável, é uma só.", "how": "Depois de T+3 e fora do congelamento, o Claude troca pelo token do painel novo (`LangPHP::php_set_vhost_versions`) e repete os três testes do item php-igual: um bloco de handler só no `.htaccess`, snippet do `redirect_canonical` com `active: true` (REST) e `/crystal-teste?cbx<ts>=1` → 200 sem Location. Roda a matriz curl e a Auditoria. Deu erro, volta a versão na hora.", "risk": "medio", "who": "claude", "proof": "`x-powered-by: PHP/7.4.33`. Code Snippets desativa snippet sozinho em erro fatal."}, {"id": "dnssec-depois", "title": "Ligar DNSSEC depois de 15 dias estável (opcional)", "why": "Protege contra DNS falsificado. Ligado cedo ou com o DS errado, derruba o domínio (SERVFAIL).", "how": "O Claude ativa o DNSSEC na zona via API e manda os dados do DS. O Luiz cola em **Registro.br > domínio > DNS > DNSSEC** (sem API pro titular). O Claude valida com `dig +dnssec` (flag AD) e DNSViz.", "risk": "baixo", "who": "ambos", "proof": "Hoje sem DS no .br e sem DNSKEY na zona."}, {"id": "cancelar-azan", "title": "Cancelar a AZAN só com tudo migrado, backup final e 15 dias estáveis", "why": "Cancelou cedo = perde o rollback, o e-mail, o leticiafelisberto.com e o checkout Guru de uma vez.", "how": "Cancelar é contrato, então é com o Luiz. Só quando o Claude confirmar:\n- ≥15 dias depois do degrau 3 sem rollback\n- E-mail migrado e testado. Até lá, ninguém remove o domínio adicional crystalnowpp.com.br do cPanel da AZAN (apaga a zona local e o e-mail)\n- leticiafelisberto.com fora da AZAN (NS e site)\n- Nenhum registro das zonas crystalnowpp.com.br e leticiafelisberto.com no Cloudflare aponta pra `45.224.128.177` ou `2804:3744:0:105::2` (`GET dns_records?content=...` vazio)\n- Backup final baixado pra pasta durável\n- Token cPanel, chave Stape e Senha de Aplicativo revogados\n\nObs.: suamelhoramiga.com também está delegado pros NS da AZAN, mas ela não responde por ele e o domínio expira em 13/09/2026. Não é b     document.getElementById('app').innerHTML =
      '<div class="wrap"><header class="masthead"><div><div class="eyebrow"><span>' + h(m.domain || '') + '</span><span class="arrow">→</span><span>Cloudflare</span><span>·</span><span>' + h(m.date || '') + '</span></div>' +
      '<h1>' + h(m.headline || 'Virada pro Cloudflare') + '</h1><p class="lede">' + rich(m.lede || '') + '</p></div>' +
      '<div class="meter" aria-live="polite"><div class="meter-num"><span id="m-done">0</span><small>de <span id="m-total">0</span> feitos</small></div><div class="bar"><i id="m-bar"></i></div><div class="meter-sub" id="m-sub"></div></div></header>' +
      (facts ? '<p class="facts-title">Retrato de hoje</p><dl class="facts">' + facts + '</dl>' : '') +
      '<div class="toolbar"><div class="seg" role="group" aria-label="Filtrar itens"><button type="button" id="f-all" data-f="all">Tudo</button><button type="button" id="f-open" data-f="open">Pendentes</button><button type="button" id="f-crit" data-f="crit">Críticos pendentes</button></div><span class="status" id="save" data-s="local">Salvo neste navegador</span></div>' +
      '<div class="layout"><nav class="rail" aria-label="Fases">' + rail + '</nav><main class="content">' + phases + asides +
      (m.footer ? '<p class="foot">' + rich(m.footer) + '</p>' : '') + '</main></div></div>';

    document.getElementById('app').addEventListener('change', function(e){
      var t = e.target; if (!t.classList || !t.classList.contains('chk')) return;
      if (t.checked) state.done[t.dataset.id] = true; else delete state.done[t.dataset.id];
      refresh(); lsSet(LS, { done: state.done });
      if (mode === 'shared') schedule(4000);
    });
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){
      b.addEventListener('click', function(){ prefs.filter = b.dataset.f; lsSet(PREF, prefs); refresh(); });
    });
  }

  function refresh(){
    var items = allItems(), done = 0, critOpen = 0, open = { critico: 0, alto: 0 };
    items.forEach(function(it){ if (state.done[it.id]) done++; else if (open[it.risk] != null) open[it.risk]++; });
    critOpen = open.critico;
    Array.prototype.forEach.call(document.querySelectorAll('.item'), function(li){
      var id = li.dataset.id, isDone = !!state.done[id];
      li.classList.toggle('done', isDone);
      li.querySelector('.chk').checked = isDone;
      li.hidden = (prefs.filter === 'open' && isDone) || (prefs.filter === 'crit' && (isDone || li.dataset.risk !== 'critico'));
    });
    (DATA.phases || []).forEach(function(p){
      var t = (p.items || []).length, d = (p.items || []).filter(function(it){ return state.done[it.id]; }).length;
      var c = document.querySelector('[data-count="' + p.id + '"]'); if (c) c.textContent = d + '/' + t;
      var r = document.querySelector('[data-rail="' + p.id + '"]'); if (r) { r.querySelector('.c').textContent = d + '/' + t; r.classList.toggle('full', t > 0 && d === t); }
    });
    document.getElementById('m-done').textContent = done;
    document.getElementById('m-total').textContent = items.length;
    document.getElementById('m-bar').style.width = (items.length ? Math.round(done / items.length * 100) : 0) + '%';
    document.getElementById('m-sub').innerHTML = (critOpen ? '<span class="chip critico">' + critOpen + ' crítico' + (critOpen > 1 ? 's' : '') + ' pendente' + (critOpen > 1 ? 's' : '') + '</span>' : '<span class="chip baixo">Nenhum crítico pendente</span>') +
      (open.alto ? '<span class="chip alto">' + open.alto + ' alto' + (open.alto > 1 ? 's' : '') + '</span>' : '');
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.f === prefs.filter)); });
  }

  function status(s, text){ var el = document.getElementById('save'); if (!el) return; el.dataset.s = s; el.textContent = text; }
  function schedule(ms){ clearTimeout(timer); status('saving', 'Salvando em instantes…'); timer = setTimeout(publish, ms); }

  function buildDoc(){
    var close = '</scr' + 'ipt>';
    var json = JSON.stringify({ done: state.done, updated: new Date().toISOString() }).replace(/</g, '\\u003c');
    return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + h(document.title) + '</title>' + document.getElementById('fonts').outerHTML +
      '<style id="css">' + document.getElementById('css').textContent + '</style></head><body><div id="app"></div>' +
      '<script type="application/json" id="data">' + document.getElementById('data').textContent + close +
      '<script type="application/json" id="state">' + json + close +
      '<script id="engine">' + document.getElementById('engine').textContent + close + '';
  }

  function publish(){
    if (!ns) return;
    var prev = ssGet(SS) || {};
    ssSet(SS, { done: state.done, scroll: window.scrollY, tries: (prev.tries || 0) + 1 });
    status('saving', 'Salvando…');
    ns.publish(buildDoc()).catch(function(e){
      var c = e && e.code;
      if (c === 'conflict') return; // a view recarrega com a versão vencedora; o pending reaplica
      ssSet(SS, null);
      if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].indexOf(c) >= 0) { mode = 'readonly'; status('local', 'Só leitura — marcações ficam neste navegador'); return; }
      if (c === 'rate_limited') { schedule(15000); return; }
      if (c === 'upstream_error' && !retried) { retried = true; schedule(1500 + Math.floor(Math.random() * 2000)); return; }
      status('error', 'Não salvou — marque de novo em instantes');
    });
  }

  build(); refresh();
  if (restoreScroll) window.scrollTo(0, restoreScroll);

  var c = window.claude;
  if (c && typeof c.use === 'function') {
    c.use('artifact').then(function(a){
      if (a && typeof a.publish === 'function') {
        ns = a; mode = 'shared'; status('shared', 'Marcações salvas na página');
        if (needsPublish) schedule(800);
      } else fallback();
    }, fallback);
  } else fallback();

  function fallback(){
    mode = 'local'; status('local', 'Salvo neste navegador');
    var l = lsGet(LS); if (l && l.done) { state.done = l.done; refresh(); }
  }
})();
</script>
