# =============================================================================
# APP DA CRYSTAL  ·  crystal-web-chat (PWA + API) na VPS
# =============================================================================
#
# O QUE ESTA STACK FAZ
#   Sobe o app web da Crystal ao lado do n8n, atrás do mesmo Traefik:
#     app.crystalnowpp.com.br  ->  app_web  (PWA em Next.js, porta 3000)
#     api.crystalnowpp.com.br  ->  app_api  (API em Fastify, porta 3001)
#   e a nossa Crystal (app_crystal, porta 8080), sem endereço público,
#   com Postgres e Redis PRÓPRIOS do app, numa rede interna só dele. Não usa o
#   Postgres nem o Redis do n8n, e não toca no Supabase da agência.
#
# REDES (revisão de segurança de 24/10, INF-06)
#   app_interno  API, Crystal, Postgres e Redis do app. Só esta stack.
#   borda_api    Traefik e app_api. Mais ninguém: é a faixa em que a API confia para
#                ler o X-Forwarded-For (TRUST_PROXY, gravado pelo bootstrap).
#   borda_web    Traefik e app_web.
#   O Traefik não está na app_interno: não alcança o Postgres, o Redis nem a Crystal.
#   Os nomes de sempre continuam valendo (app_postgres, app_redis, app_crystal), porque
#   quem os usa está na mesma app_interno. borda_api e borda_web são criadas pelo
#   'bootstrap-vps.sh preparar'; o app-subir recusa subir se o Traefik ainda não está nelas.
#
# DE ONDE VÊM AS IMAGENS
#   GitHub Actions do repositório LFcrystal766/crystal-web-chat
#   (.github/workflows/imagens-vps.yml), em ghcr.io, com tag sha-XXXXXXX ou vX.
#   Nunca latest. As imagens são privadas: a VPS precisa de "docker login
#   ghcr.io" antes (bootstrap-vps.sh app-ghcr).
#
# O QUE NÃO ESTÁ NESTE ARQUIVO
#   Segredo nenhum. A API lê /root/crystal/app/api.env, a Crystal lê
#   crystal.env, o web lê web.env (só o público do /.well-known), o Postgres lê
#   postgres.env e o Redis lê redis.env, todos gerados na VPS pelo bootstrap
#   (chmod 600). Os marcadores abaixo são trocados pelo bootstrap:
#     APP_TAG       tag das imagens
#     APP_ENV_DIR   pasta dos .env (padrão /root/crystal/app)
#
# LIMITE CONHECIDO (INF-05, revisão de 24/10/2026)
#   No Swarm o env_file é lido na hora do deploy e os valores vão para o spec do
#   serviço: 'docker service inspect crystal_app_app_api' e a tela do serviço no
#   Portainer mostram ENCRYPTION_KEY, JWT_SECRET, SUPABASE_SERVICE_ROLE_KEY etc. O
#   chmod 600 dos .env não alcança o spec. Quem chega ao spec já manda no Docker
#   (é root na VPS), então a defesa hoje é: painel. só para IPs liberados
#   (bootstrap-vps.sh painel-restringir; o app-subir avisa se não estiver), agente
#   do Portainer em rede interna e nenhum outro serviço com o docker.sock além do
#   Traefik e desse agente. Migrar para Docker secrets (um arquivo por segredo em /run/secrets,
#   nome com versão, command que exporta antes do exec) fica para a onda de infra:
#   mexe no command dos três serviços e no roteiro de troca de chave.
#
# COMO SUBIR
#   bash bootstrap-vps.sh app-subir sha-XXXXXXX
#   (o bootstrap grava /root/crystal/stacks/10-crystal-app.yaml e faz
#    docker stack deploy --with-registry-auth -c ... crystal_app)
#
# DNS: app. e api. em A -> IP da VPS, CINZA. O Traefik emite o certificado por
# desafio HTTP; com a nuvem laranja a emissão falha.
# =============================================================================

version: "3.7"

# Logs do Docker com rotação (achado 27): sem isto o json-file cresce sem limite e
# guarda o IP de cada requisição sem prazo. 3 arquivos de 10 MB por contêiner.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ---------------------------------------------------------------- Postgres
  app_postgres:
    image: postgres:16-alpine
    logging: *logs
    env_file: APP_ENV_DIR/postgres.env
    networks:
      - app_interno
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "1", memory: 1024M}
      restart_policy: {condition: any, delay: 5s}

  # ---------------------------------------------------------------- Redis
  # Sessões (janela do refresh) e rate limit vivem aqui: sem despejo de chave
  # (noeviction) e com persistência, senão um reinício desloga todo mundo.
  # Com senha desde 24/10 (INF-12): a Crystal, na mesma rede interna e processando saída de
  # modelo, não escreve mais nas sessões nem nos contadores de limite. A senha vem do
  # redis.env (gerado pelo bootstrap, chmod 600) e o REDIS_URL da API a leva. O command passa
  # pelo docker-entrypoint.sh da imagem, que troca para o usuário redis (sem root).
  app_redis:
    image: redis:7-alpine
    logging: *logs
    env_file: APP_ENV_DIR/redis.env
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    networks:
      - app_interno
    volumes:
      - app_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 512M}
      restart_policy: {condition: any, delay: 5s}

  # ---------------------------------------------------------------- API
  # Aplica as migrações do Prisma e sobe. UMA réplica: com duas, as duas
  # migrariam ao mesmo tempo e o fan-out do chat (em memória) se dividiria.
  # Postgres lento na subida (achado 28): a migração tenta de novo por até 1 min
  # antes de desistir, e o restart_policy sem max_attempts nunca deixa a API em 0/1.
  app_api:
    image: ghcr.io/lfcrystal766/crystal-web-chat-api:APP_TAG
    logging: *logs
    command:
      - sh
      - -c
      - >-
        n=0;
        until pnpm --filter @crystal/api db:migrate:deploy;
        do n=$$((n+1)); [ $$n -ge 12 ] && exit 1; echo "migração: app_postgres ainda não aceita ($$n/12), de novo em 5 s"; sleep 5; done;
        exec pnpm --filter @crystal/api start
    env_file: APP_ENV_DIR/api.env
    networks:
      - app_interno
      - borda_api
    volumes:
      - app_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Migração + boot. O Swarm só troca a tarefa depois disso.
      start_period: 90s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "1", memory: 1024M}
      update_config:
        parallelism: 1
        # stop-first: nunca duas APIs migrando ao mesmo tempo.
        order: stop-first
        failure_action: rollback
        monitor: 120s
      # Sem max_attempts (achado 28): depois de 5 falhas o Swarm desistia e a API
      # ficava 0/1 até alguém agir.
      restart_policy: {condition: any, delay: 10s}
      labels:
        - traefik.enable=true
        - traefik.docker.network=borda_api
        - traefik.http.routers.crystal_app_api.rule=Host(`api.crystalnowpp.com.br`)
        - traefik.http.routers.crystal_app_api.entrypoints=websecure
        - traefik.http.routers.crystal_app_api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crystal_app_api.service=crystal_app_api
        - traefik.http.services.crystal_app_api.loadbalancer.server.port=3001
        - traefik.http.services.crystal_app_api.loadbalancer.passHostHeader=true

  # ---------------------------------------------------------------- Web (PWA)
  # Nenhum segredo: o endereço da API já está embutido na imagem (build).
  # A nossa Crystal (apps/crystal do crystal-web-chat). Só na rede interna:
  # sem rota no Traefik, só o app_api a alcança. Memória no app_postgres, em
  # banco e papel próprios (crystal_agente), criados pelo bootstrap.
  app_crystal:
    image: ghcr.io/lfcrystal766/crystal-web-chat-crystal:APP_TAG
    logging: *logs
    env_file: APP_ENV_DIR/crystal.env
    networks:
      - app_interno
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "0.5", memory: 384M}
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
      restart_policy: {condition: any, delay: 5s}

  app_web:
    image: ghcr.io/lfcrystal766/crystal-web-chat-web:APP_TAG
    logging: *logs
    # Só ANDROID_CERT_SHA256 e APPLE_TEAM_ID (públicos, para o /.well-known).
    env_file: APP_ENV_DIR/web.env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    networks:
      - borda_web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      resources:
        limits: {cpus: "1", memory: 512M}
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 60s
      restart_policy: {condition: any, delay: 5s}
      labels:
        - traefik.enable=true
        - traefik.docker.network=borda_web
        - traefik.http.routers.crystal_app_web.rule=Host(`app.crystalnowpp.com.br`)
        - traefik.http.routers.crystal_app_web.entrypoints=websecure
        - traefik.http.routers.crystal_app_web.tls.certresolver=letsencryptresolver
        - traefik.http.routers.crystal_app_web.service=crystal_app_web
        - traefik.http.services.crystal_app_web.loadbalancer.server.port=3000
        - traefik.http.services.crystal_app_web.loadbalancer.passHostHeader=true

networks:
  # Overlay comum (não internal): a Crystal sai para o OpenRouter e o Supabase por ela.
  app_interno:
    driver: overlay
  borda_api:
    external: true
    name: borda_api
  borda_web:
    external: true
    name: borda_web

volumes:
  app_postgres_data:
  app_redis_data:
  app_uploads:
