# =============================================================================
# REDIS DO n8n  ·  fila entre o editor e os workers
# =============================================================================
#
# O QUE ESTE SERVIÇO FAZ
#   É a fila de trabalho do n8n em modo fila. Quando um webhook chega, o serviço
#   que o recebeu coloca a execução aqui, e um worker livre pega para executar.
#
#   O conteúdo é trabalho em andamento, não cache. Por isso a persistência fica
#   LIGADA (appendonly) e não há descarte automático de chaves: descartar uma
#   chave aqui significa perder uma execução que já foi aceita.
#
# ORDEM DE INSTALAÇÃO
#   Quarto, junto com o Postgres. Antes dos serviços do n8n.
#
# ANTES DE SUBIR, criar o volume (uma vez só, no manager):
#   docker volume create n8n_redis_data
#
# O QUE VOCÊ PRECISA TROCAR NESTE ARQUIVO
#   Nada. Ele sobe como está.
#
# COMO SUBIR
#   docker stack deploy -c 03-n8n-redis.yaml n8n_redis
#
# BACKUP
#   Não precisa. Guarda apenas trabalho em andamento, não histórico. A
#   persistência existe para sobreviver a um reinício, não para arquivamento.
# =============================================================================

version: "3.7"

services:
  n8n_redis:
    image: redis:7
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"

    # Revisão de 24/10 (INF-28): log do Docker com rotação, 3 arquivos de 10 MB. Antes, sem
    # limite (o json-file crescia até encher o disco).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # appendonly yes = grava cada alteração em disco, para que a fila sobreviva
    # a um reinício do contêiner.
    command: redis-server --appendonly yes --port 6379

    # Revisão de 24/10 (INF-06): só na rede interna do n8n. Antes ficava na rede pública,
    # junto com o app, o Chatwoot e o Traefik; agora só o editor, o webhook e o worker do
    # n8n o alcançam (pelo mesmo nome, n8n_redis).
    networks:
      - n8n_interno

    # A porta NÃO é publicada: o Redis só é alcançável de dentro da rede do
    # Docker. Nunca exponha um Redis à internet.

    volumes:
      - n8n_redis_data:/data

    # Revisão de 24/10: teste de saúde (antes não havia). A senha (--requirepass, posta pelo
    # bootstrap) não fica no ambiente; sem ela o Redis responde NOAUTH, o que já prova que
    # está de pé e atendendo.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>&1 | grep -qE 'PONG|NOAUTH'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.app == n8n
      resources:
        limits:
          cpus: "1"
          memory: 1024M

volumes:
  n8n_redis_data:
    external: true
    name: n8n_redis_data

networks:
  # Criada pelo 'bootstrap-vps.sh preparar' (overlay, sem attachable). Externa porque o
  # n8n está em cinco stacks (postgres, redis, editor, webhook, worker).
  n8n_interno:
    external: true
    name: n8n_interno
