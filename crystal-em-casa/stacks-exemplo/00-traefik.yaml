# =============================================================================
# TRAEFIK v2  ·  proxy reverso e certificados HTTPS automáticos
# =============================================================================
#
# O QUE ESTE SERVIÇO FAZ
#   Recebe todo o tráfego que chega da internet nas portas 80 e 443, descobre
#   sozinho quais serviços estão no ar (lendo as etiquetas de cada stack) e
#   encaminha cada requisição para o serviço certo. Também emite e renova os
#   certificados HTTPS de graça, via Let's Encrypt.
#
# ORDEM DE INSTALAÇÃO
#   Este é o PRIMEIRO serviço a subir. Nada mais funciona sem ele.
#
# ANTES DE SUBIR, criar as redes e os volumes (uma vez só, no manager):
#   docker network create --driver=overlay network_swarm_public
#   docker volume create volume_swarm_certificates
#   As redes de borda (borda_api, borda_web, borda_atendimento, borda_n8n, borda_painel)
#   e a n8n_interno são criadas pelo 'bash bootstrap-vps.sh preparar' (revisão de
#   segurança de 24/10, INF-06). Na mão: docker network create --driver=overlay NOME
#
# O QUE VOCÊ PRECISA TROCAR NESTE ARQUIVO
#   1. SEU_EMAIL_AQUI  ->  um e-mail seu, válido. O Let's Encrypt usa esse
#      endereço para avisar se um certificado estiver perto de vencer.
#
# COMO SUBIR
#   docker stack deploy -c 00-traefik.yaml traefik
# =============================================================================

version: "3.7"

services:
  traefik:
    # Versão fixa (nunca latest). 24/10/2026: v2.11.3 -> v2.11.60, a última da linha 2.11
    # (revisão de segurança, INF-01). Entre as correções: CVE-2024-45410 (cabeçalhos
    # X-Forwarded-* vindos do cliente) e CVE-2025-32431 (/../ no caminho contornava regras
    # PathPrefix/Path: é o que protege o /super_admin do Chatwoot). Desde a 2.11.24 o caminho
    # é sanitizado e desde a 2.11.25 normalizado (%2E%2E), antes de casar as regras.
    # Notas lidas (docs/content/migration/v2.md, 2.11.4 a 2.11.60): nada que mude esta VPS.
    # Desde a 2.11.45 o provedor Docker usa a API 1.40 ou mais nova; o min-api-version=1.24
    # gravado pelo 'docker-api' continua aceitando e pode ficar como está.
    # Atualizar: ler as notas, trocar aqui e, na VPS:
    #   bash bootstrap-vps.sh preparar EMAIL && bash bootstrap-vps.sh traefik
    # (o 'traefik' confere a versão no ar e testa o /super_admin com /../ ao final).
    # Volta: docker service rollback traefik_traefik
    # A linha 2 está no fim da vida: planejar a v3 (providers.swarm no lugar de
    # providers.docker.swarmMode).
    image: traefik:v2.11.60
    hostname: "{{.Service.Name}}.{{.Task.Slot}}"

    command:
      # --- Descoberta de serviços -------------------------------------------
      # Lê o Docker para descobrir quais serviços existem, em modo Swarm.
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # IMPORTANTE: só expõe serviços que pedirem explicitamente, com a
      # etiqueta "traefik.enable=true". Sem isso, tudo ficaria público.
      - "--providers.docker.exposedbydefault=false"
      # Rede padrão em que o Traefik procura os serviços. Cada serviço publicado diz a
      # sua com a etiqueta traefik.docker.network=borda_... (INF-06); esta só vale para
      # quem não disser (a stack da agência em ia.).
      - "--providers.docker.network=network_swarm_public"

      # --- Portas de entrada ------------------------------------------------
      # "web" é a porta 80 (HTTP) e "websecure" é a 443 (HTTPS).
      # Todo acesso HTTP é redirecionado para HTTPS automaticamente.
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # Limpa /../, /./ e // do caminho antes de casar as regras (padrão desde a v2.11.24;
      # escrito aqui para não depender do padrão). Exige v2.11.24 ou mais nova: numa versão
      # anterior o Traefik não sobe com esta opção.
      - "--entrypoints.websecure.http.sanitizePath=true"
      # IP de quem acessa (revisão de 24/10, INF-06; CVE-2024-45410 já corrigida na v2.11.60).
      # O Traefik recebe a internet direto (portas em modo host, sem balanceador na frente; app.,
      # api., atendimento., editor., webhook. e painel. ficam com a nuvem CINZA). Então não
      # confia em X-Forwarded-* de ninguém: apaga o que vier do cliente e escreve o IP real da
      # conexão. É o padrão; fica escrito para ninguém trocar sem pensar. Sem proxyProtocol pelo
      # mesmo motivo. A API, do outro lado, só confia no X-Forwarded-For que vem da borda_api,
      # onde só o Traefik está (TRUST_PROXY, gravado pelo bootstrap-vps.sh no api.env).
      # Se um dia esses nomes ficarem LARANJA no Cloudflare: aqui entram só as faixas dele
      # (https://www.cloudflare.com/ips/) em forwardedHeaders.trustedIPs, nos dois entrypoints,
      # e o TRUST_PROXY passa a incluí-las. Nunca forwardedHeaders.insecure=true.
      - "--entrypoints.web.forwardedHeaders.insecure=false"
      - "--entrypoints.websecure.forwardedHeaders.insecure=false"

      # --- Certificados HTTPS -----------------------------------------------
      # O nome "letsencryptresolver" é referenciado pelas outras stacks.
      # Se você mudar aqui, mude em todas as outras também.
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencryptresolver.acme.email=SEU_EMAIL_AQUI"
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/etc/traefik/letsencrypt/acme.json"

      # --- Painel do Traefik ------------------------------------------------
      # Deixado LIGADO mas SEM rota pública: o painel não fica acessível pela
      # internet. Para consultá-lo, use um túnel SSH até a máquina.
      - "--api.dashboard=true"

      # --- Registros --------------------------------------------------------
      # Use "DEBUG" apenas para investigar um problema. Em operação normal,
      # "INFO" evita encher o disco.
      - "--log.level=INFO"
      - "--log.format=common"
      - "--log.filePath=/var/log/traefik/traefik.log"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access-log"

    volumes:
      # Só leitura: o Traefik precisa consultar o Docker, nunca alterá-lo.
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Onde os certificados ficam guardados. Se este volume for perdido, os
      # certificados são emitidos de novo, sem intervenção.
      - "vol_certificates:/etc/traefik/letsencrypt"

    # Redes separadas (revisão de segurança de 24/10, INF-06): uma rede de borda por stack,
    # e o Traefik é o único que está em todas. Assim um serviço não alcança o de outra stack
    # pulando o Traefik (o n8n não fala direto com a API nem com o Chatwoot), e o Traefik
    # nunca está numa rede de banco (n8n_interno, app_interno, cw_interno ficam fora daqui).
    #   borda_api          app_api              (api.)
    #   borda_web          app_web              (app.)
    #   borda_atendimento  cw_rails             (atendimento.)
    #   borda_n8n          n8n editor e webhook (editor., webhook.)
    #   borda_painel       Portainer            (painel.)
    #   network_swarm_public  a rede de antes: fica para a volta (redes-voltar) e para a
    #                      Crystal do WhatsApp da agência (ia.), enquanto ela existir.
    networks:
      - network_swarm_public
      - borda_api
      - borda_web
      - borda_atendimento
      - borda_n8n
      - borda_painel

    ports:
      # "mode: host" preserva o IP real de quem acessa, o que importa para
      # registros de acesso e para bloqueios por IP.
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host

    deploy:
      placement:
        constraints:
          # O Traefik precisa rodar em um nó manager, porque lê o estado do Swarm.
          - node.role == manager

      labels:
        - "traefik.enable=true"
        # Garante que qualquer acesso HTTP vire HTTPS, inclusive em domínios
        # que ainda não têm rota configurada.
        - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"
        - "traefik.http.routers.http-catchall.rule=hostregexp(`{host:.+}`)"
        - "traefik.http.routers.http-catchall.entrypoints=web"
        - "traefik.http.routers.http-catchall.middlewares=redirect-https@docker"
        - "traefik.http.routers.http-catchall.priority=1"

volumes:
  vol_certificates:
    external: true
    name: volume_swarm_certificates

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
  borda_api:
    external: true
    name: borda_api
  borda_web:
    external: true
    name: borda_web
  borda_atendimento:
    external: true
    name: borda_atendimento
  borda_n8n:
    external: true
    name: borda_n8n
  borda_painel:
    external: true
    name: borda_painel
