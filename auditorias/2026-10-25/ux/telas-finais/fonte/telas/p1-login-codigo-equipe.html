<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport-mock" content="390x844">
<title>Login da equipe, passo do código</title>
<link rel="stylesheet" href="../ds.css">
<style>
  .auth-titulo { font-size: var(--fs-base); line-height: var(--lh-base); font-weight: 600; color: var(--ink); }
  .passo-titulo { font-size: var(--fs-lg); line-height: var(--lh-lg); font-weight: 600; color: var(--ink); }
  .passo-lead { margin-top: 4px; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-muted); }
  .passo-nao-chegou { margin-top: 8px; font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink); }
  .otp-timer:empty { display: none; }
  .field-codigo { text-indent: 0.3em; }
  .linha-acoes { display: flex; align-items: center; gap: 16px; margin-top: -8px; }
  .linha-acoes .cresce { justify-content: flex-start; }
</style>
</head>
<body>
<div class="tela"><main class="auth">
  <div class="crystal-lockup crystal-lockup-lg">
    <span class="crystal-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="cm-faceta" d="M24 9 36 24 24 39 12 24Z"/><path class="cm-faceta cm-topo" d="M24 9 36 24H12Z"/><path class="cm-linha" d="M24 9v30M12 24h24"/></svg></span>
    <span class="crystal-lockup-nome">Crystal</span>
  </div>

  <form class="auth-cartao" novalidate>
    <p class="auth-titulo">Acesso da equipe</p>

    <!-- U24 item 6: OtpStep voz="equipe". Sem "Te mandei" e sem prazo no texto. -->
    <div>
      <h2 class="passo-titulo">Confirme com o código do e-mail</h2>
      <p class="passo-lead">Mandamos um código de 6 dígitos para r***@exemplo.com. Digite o código aqui embaixo.</p>
      <p class="passo-nao-chegou">Não chegou? Olhe o spam ou peça o reenvio.</p>
    </div>

    <div class="field field-lg">
      <label class="field-label" for="otp-code">Código de verificação</label>
      <input class="field-input field-codigo is-focus" id="otp-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" maxlength="6" value="482917" aria-describedby="otp-timer">
      <p class="field-hint otp-timer" id="otp-timer"></p>
    </div>

    <button type="submit" class="btn btn-cta btn-lg btn-full">Entrar</button>

    <div class="linha-acoes">
      <button type="button" class="btn btn-text is-marca cresce" disabled>Reenviar em 42 s</button>
      <button type="button" class="btn btn-text">Voltar</button>
    </div>
  </form>

  <p class="auth-rodape">
    <svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>Área da equipe</span><span aria-hidden="true">·</span><a href="#">Privacidade</a><span aria-hidden="true">·</span><a href="#">Termos de Uso</a>
  </p>
</main></div>
</body>
</html>
