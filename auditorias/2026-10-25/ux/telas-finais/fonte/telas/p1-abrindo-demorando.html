<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport-mock" content="390x844">
<title>Abrindo o painel, demorando</title>
<link rel="stylesheet" href="../ds.css">
<style>
  .abrindo { display: flex; align-items: center; justify-content: center; height: 100%; padding: 0 16px; }
  .abrindo-status { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 340px; }
  .abrindo .crystal-mark { width: 56px; height: 56px; }
  .abrindo .notice { width: 100%; }
</style>
</head>
<body>
<div class="tela"><main class="abrindo">
  <!-- U26 item 2: depois de 8 s sem resposta do /me. Nada do painel aparece: nem menu, nem áreas, nem a palavra "equipe". -->
  <div class="abrindo-status">
    <span class="crystal-mark is-pulsando"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="cm-faceta" d="M24 9 36 24 24 39 12 24Z"/><path class="cm-faceta cm-topo" d="M24 9 36 24H12Z"/><path class="cm-linha" d="M24 9v30M12 24h24"/></svg></span>
    <div class="notice notice-warning" role="alert">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      <div class="notice-corpo"><p>Está demorando mais que o normal. Confere a internet.</p>
        <div class="notice-acoes"><button class="btn btn-secondary"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Tentar de novo</button></div></div>
    </div>
  </div>
</main></div>
</body>
</html>
