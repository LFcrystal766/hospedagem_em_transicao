<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Financeiro · Crystal</title>
<link rel="stylesheet" href="../ds.css">
<style>
  svg.i { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .staff-nav { gap: 10px; padding: 10px 12px; }
  .staff-main { display: flex; flex-direction: column; gap: 16px; }
  .staff-main > * { flex-shrink: 0; }
  .tabs a.tab { display: inline-flex; align-items: center; }
  .sem-quebra { white-space: nowrap; }
  .card-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .meta { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-muted); }
  .acoes { display: flex; flex-wrap: wrap; gap: 8px; }
  /* "Detalhe técnico" recolhido (U41) */
  details.dt summary { list-style: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; margin: -8px 0 -6px; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  details.dt summary::-webkit-details-marker { display: none; }
  details.dt summary .icon { width: 16px; height: 16px; }
  details.dt[open] summary .icon { transform: rotate(180deg); }
  .dt-texto { margin-top: 6px; padding: 8px 10px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--warning) 12%, var(--bg-app)); font-family: var(--font-mono); font-size: 13px; line-height: 18px; color: var(--ink); overflow-wrap: anywhere; }
  /* "Ver como tabela" e "Como é calculado" (links que abrem) */
  .abre { list-style: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-size: var(--fs-sm); color: var(--brand-ink); cursor: pointer; }
  .abre::-webkit-details-marker { display: none; }
  .abre .icon { width: 16px; height: 16px; }

  .staff-main { gap: 12px; }
  .mes-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .mes-nav .btn { padding: 0 12px; gap: 4px; }
  .mes-nav .btn .icon { width: 18px; height: 18px; }
  .mes { font-size: var(--fs-sm); font-weight: 600; color: var(--ink); white-space: nowrap; }
  .grade-stats .stat { display: flex; flex-direction: column; justify-content: space-between; padding: 12px 14px; }
  .filtros-linha { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip-filtro { display: inline-flex; align-items: center; min-height: 44px; padding-left: 14px; border-radius: var(--radius-full); background: color-mix(in srgb, var(--brand) 12%, transparent); color: var(--brand-ink); font-size: var(--fs-sm); font-weight: 500; }
  .chip-x { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 44px; color: var(--brand-ink); }
  .chip-x .icon { width: 18px; height: 18px; }
  .lancs { display: flex; flex-direction: column; gap: 8px; }
  .lanc { display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 10px 12px 14px; text-align: left; }
  .lanc-corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .lanc-l1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .lanc-nome { font-size: var(--fs-base); line-height: var(--lh-base); font-weight: 600; color: var(--ink); }
  .lanc-cpf { font-size: var(--fs-xs); line-height: var(--lh-xs); color: var(--ink-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .lanc-l2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .lanc-valor { margin-right: 4px; font-size: var(--fs-base); line-height: var(--lh-base); font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .lanc-l3 { font-size: var(--fs-sm); line-height: var(--lh-sm); color: var(--ink-muted); }
  .lanc > .icon { color: var(--ink-muted); }

</style>
</head>
