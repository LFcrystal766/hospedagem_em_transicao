<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="viewport-mock" content="390x844">
<title>Faixa de instalar</title>
<link rel="stylesheet" href="../ds.css">
<style>
  /* Faixa de instalar (U01): degradê verde novo, contêiner py-1.5 e botão branco de 44 px com tinta --success-strong.
     Altura total 44 + 12 = 56 px, a mesma de hoje. */
  .faixa-instalar { display: flex; align-items: center; gap: 12px; padding: 6px 16px; background-color: var(--success); background-image: var(--cta-gradient); border-bottom: 1px solid var(--cta-edge); color: var(--on-brand); }
  .faixa-instalar > .icon { width: 20px; height: 20px; flex-shrink: 0; }
  .faixa-instalar p { flex: 1; min-width: 0; font-size: var(--fs-sm); line-height: var(--lh-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .faixa-instalar-btn { min-height: 44px; padding: 0 18px; border-radius: var(--radius-full); background: #ffffff; color: var(--success-strong); font-size: var(--fs-sm); font-weight: 600; }
  .estado { color: var(--ink-muted); }
</style>
</head>
<body>
<div class="tela"><div class="app">
  <div class="faixa-instalar sobre-cor">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></svg>
    <p>Instale o app da Crystal</p>
    <button class="faixa-instalar-btn" type="button">Instalar</button>
  </div>
  <header class="app-header">
    <span class="crystal-lockup">
      <span class="crystal-mark"><svg viewBox="0 0 48 48" aria-hidden="true"><path class="cm-faceta" d="M24 9 36 24 24 39 12 24Z"/><path class="cm-faceta cm-topo" d="M24 9 36 24H12Z"/><path class="cm-linha" d="M24 9v30M12 24h24"/></svg></span>
      <span class="crystal-lockup-nome">Crystal</span>
    </span>
    <div class="menu-ancora"><button class="icon-btn" aria-label="Abrir menu" aria-haspopup="menu"><svg class="icon icon-24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button></div>
  </header>

  <main class="app-main">
    <section class="pilha-sm" style="align-items:center;text-align:center;padding-top:8px">
      <span class="avatar avatar-96 avatar-iniciais" aria-hidden="true">A</span>
      <p class="forte" style="font-size:var(--fs-lg);line-height:var(--lh-lg)">Ana</p>
      <p class="texto-apoio estado">Complete seu perfil para liberar a Crystal</p>
    </section>

    <nav class="caminhos" aria-label="Caminhos">
      <a class="caminho" href="#">Perfil</a>
      <a class="caminho is-travado" href="#" aria-label="Conversa (travada)"><svg class="icon icon-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Conversa</a>
      <a class="caminho" href="#">Suporte</a>
    </nav>

    <section class="pilha-sm">
      <h2 class="secao-titulo">Conversas</h2>
      <!-- U01: a linha travada sem opacidade no texto; o cadeado e a foto esmaecida dizem "travada" -->
      <button class="contato is-travada">
        <img class="avatar avatar-48" src="../assets/crystal-foto.jpg" alt="">
        <span class="contato-texto"><span class="contato-nome">Crystal</span><span class="contato-previa">Liberada quando você salvar o perfil</span></span>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
    </section>
  </main>
</div></div>
</body>
</html>
